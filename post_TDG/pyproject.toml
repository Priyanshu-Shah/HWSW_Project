[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "post-tdg-partitioner"
version = "0.1.0"
description = "post_TDG: costed TDG -> HW/SW partition (exact solver, heuristics, GNN)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "numpy>=1.26",
    "pulp>=2.9,<4",   # 4.x changed the modelling API and dropped the bundled CBC
    "highspy>=1.7,<1.13",  # HiGHS MILP solver; PuLP 3.3 does not detect highspy 1.15
    "ortools>=9.10",  # CP-SAT exact solver (preferred label generator beyond ~10 tasks)
    "numba>=0.60",    # compiled evaluator of the fast heuristics (fastheur/)
]

[project.scripts]
partition = "post_tdg.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "jsonschema>=4.18", "ruff"]
data = ["pandas>=2.0"]   # scripts/profile_quickest.py
ml = ["torch>=2.4"]      # GNN partitioner (CPU wheel: --index-url https://download.pytorch.org/whl/cpu)

[tool.setuptools.packages.find]
include = ["schemas*", "estimate*", "sim*", "solvers*", "datagen*", "metrics*", "diagnostics*", "fastheur*", "post_tdg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
