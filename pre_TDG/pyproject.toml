[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hwsw-pre-tdg"
version = "0.1.0"
description = "English task -> costed TDG: LLM pipeline and custom_hls"
requires-python = ">=3.11"
dependencies = [
    "jsonschema>=4.21",
    "networkx>=3.2",
    "pydantic>=2.6",
    "rich>=13",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
hwsw = "hwsw.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hwsw = ["spec/*.json", "custom_hls/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
